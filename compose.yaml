services:
  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - app
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      TASKS_DB_URL: jdbc:postgresql://db:5432/tasks_list
      TASKS_DB_USER: tasks_list
      TASKS_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TASKS_FRONTEND_ORIGIN: http://localhost:5173
      TASKS_LOG_FILE: /app/logs/tasks-list.log
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - app
      - data
    restart: unless-stopped

  db:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: tasks_list
      POSTGRES_USER: tasks_list
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks_list -d tasks_list"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    restart: unless-stopped

networks:
  app:
  data:
    internal: true

volumes:
  postgres_data:
