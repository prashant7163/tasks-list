schema_version: 1.0.0
policy_id: task-workflow
transitions:
  planned: [readiness_pending]
  readiness_pending: [ready, blocked, cancelled]
  ready: [claimed]
  claimed: [running, interrupted, cancelled]
  running: [waiting, material_deviation, blocked, implementation_complete, failed, interrupted, cancelled]
  waiting: [running, blocked, interrupted, cancelled]
  material_deviation: [ready, blocked, cancelled]
  blocked: [ready, cancelled]
  implementation_complete: [code_review, documentation_review]
  code_review: [build_verification, quality_review, revision_required, failed]
  build_verification: [quality_review, revision_required, failed]
  quality_review: [independent_audit, revision_required, failed]
  independent_audit: [audit_triage, failed]
  audit_triage: [awaiting_user_approval, revision_required, independent_audit]
  documentation_review: [independent_audit, awaiting_user_approval, revision_required]
  awaiting_user_approval: [approved, revision_required, cancelled]
  revision_required: [planned]
  failed: [ready, cancelled]
  interrupted: [ready, failed, cancelled]
  approved: []
  cancelled: []
terminal_states: [approved, cancelled]
